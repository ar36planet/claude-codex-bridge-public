# Runs only the tests that need nothing but Node.
#
# The spikes (scripts/spike-*.mjs) are deliberately absent: they drive a real
# `codex app-server`, which needs the Codex CLI and a logged-in account. They
# stay a local, deliberate step.
#
# The Node range mirrors `engines`. It was once set from an inference rather than
# a measurement, and the first CI run caught that: Node 22 failed exactly as
# Node 20 did, so the ">=22" floor was wrong until the tests were fixed. Node 20
# was measured green afterwards but is deliberately not in the matrix — it is
# past end-of-life, and testing a version `engines` refuses is a contradiction.
#
# The OS matrix is the point. This project claims to be platform-neutral —
# paths always go through node:path, and resolveCodex() special-cases Windows
# only — but that claim was previously held up by a human running the suite on
# one machine at a time. This is what keeps it true.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # `npm test` = syntax check + unit + in-memory MCP + a real STDIO
      # child-process smoke test. No model calls, no network, no secrets.
      - run: npm test
